<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login">

        <h1>Login</h1>

        <form action="sucesso.html">

            <label>Usuário</label>

            <input
                type="text"
                placeholder="Digite seu usuário"
                required
            >

            <p class="erro">
                Usuário incorreto.
            </p>


            <label>Senha</label>

            <input
                type="password"
                placeholder="Digite sua senha"
                required
            >

            <p class="erro">
                Senha incorreta.
            </p>


            <button type="submit">
                Entrar
            </button>

        </form>

    </div>

</body>

</html>
