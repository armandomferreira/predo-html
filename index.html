<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xuão import</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login">
        <h1>Login</h1>

        <input id="usuario" type="text" placeholder="Usuário">
        <p id="erroUsuario"></p>

        <input id="senha" type="password" placeholder="Senha">
        <p id="erroSenha"></p>

        <button onclick="login()">Entrar</button>
    </div>

    <script>
        function login() {

            let usuario = document.getElementById("usuario").value;
            let senha = document.getElementById("senha").value;

            document.getElementById("erroUsuario").innerHTML = "";
            document.getElementById("erroSenha").innerHTML = "";

            if (usuario != "admin") {
                document.getElementById("erroUsuario").innerHTML = "Usuário incorreto!";
            }

            if (senha != "1234") {
                document.getElementById("erroSenha").innerHTML = "Senha incorreta!";
            }

            if (usuario == "xuxu" && senha == "6666") {
                alert("Login realizado!");
            }
        }
    </script>

</body>
</html>
